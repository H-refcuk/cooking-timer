<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cooking Timer</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f7f7f5}
*{box-sizing:border-box}body{margin:0;padding:24px}
main{max-width:620px;margin:auto}
h1{font-size:20px;margin:0 0 18px}
section{background:white;border:1px solid #ddd;border-radius:18px;padding:18px;margin-bottom:14px}
.display{text-align:center;font-size:76px;font-variant-numeric:tabular-nums;letter-spacing:.03em;padding:20px 0}
.controls,.presets{display:flex;flex-wrap:wrap;gap:8px}
button,input{font:inherit;min-height:44px;border-radius:12px}
button{border:1px solid #ccc;background:white;padding:0 16px;cursor:pointer}
button.primary{background:#171717;color:white;border-color:#171717}
input{border:1px solid #ccc;padding:0 12px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-grid{display:grid;grid-template-columns:1fr 100px 100px;gap:8px}
.preset{flex:1 1 150px;text-align:left;padding:10px 12px}
.preset strong,.preset span{display:block}
.preset span{color:#777;font-size:14px;margin-top:2px}
.msg{color:#666;font-size:14px;min-height:20px;margin:8px 0 0}
@media(max-width:560px){.add-grid{grid-template-columns:1fr 1fr}.add-grid input:first-child{grid-column:1/-1}.add-grid button{grid-column:1/-1}.display{font-size:62px}}
</style>
</head>
<body>
<main>
<h1>🍳 Cooking Timer</h1>

<section>
<div id="display" class="display" aria-live="polite">00:00</div>
<div class="controls" style="justify-content:center">
<button id="start" class="primary">Start</button>
<button id="pause">Pause</button>
<button id="reset">Reset</button>
</div>
</section>

<section>
<h2 style="font-size:16px">Set Timer</h2>
<form id="timerForm" class="grid">
<label>Minutes<input id="minutes" type="number" min="0" max="999" value="5"></label>
<label>Seconds<input id="seconds" type="number" min="0" max="59" value="0"></label>
<button class="primary" style="grid-column:1/-1">Set Timer</button>
</form>
<p id="message" class="msg"></p>
</section>

<section>
<h2 style="font-size:16px">Custom Buttons</h2>
<div id="presets" class="presets"></div>
<form id="presetForm" class="add-grid" style="margin-top:12px">
<input id="presetName" maxlength="30" placeholder="Button name, e.g. Boiled Egg">
<input id="presetMinutes" type="number" min="0" max="999" value="5" placeholder="Min">
<input id="presetSeconds" type="number" min="0" max="59" value="0" placeholder="Sec">
<button class="primary">Add Custom Button</button>
</form>
</section>
</main>

<script>
(() => {
let total=0, remaining=0, interval=null;
const $=id=>document.getElementById(id);
const display=$('display'), msg=$('message'), presets=$('presets');

function fmt(n){n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function render(){display.textContent=fmt(remaining)}
function stop(){if(interval){clearInterval(interval);interval=null}}
function setTimer(sec){stop();total=Math.max(0,sec);remaining=total;render();msg.textContent=total?'Timer set.':'Please set a time greater than 0.'}
function start(){
 if(remaining<=0){msg.textContent='Set a timer first.';return}
 if(interval)return;
 msg.textContent='Running...';
 interval=setInterval(()=>{remaining--;render();if(remaining<=0){remaining=0;render();stop();msg.textContent='Time is up!'}} ,1000)
}
function addPreset(name,sec){
 const b=document.createElement('button'); b.type='button'; b.className='preset';
 const strong=document.createElement('strong'), span=document.createElement('span');
 strong.textContent=name; span.textContent=fmt(sec); b.append(strong,span);
 b.onclick=()=>setTimer(sec); presets.appendChild(b);
}
[['Boiled Egg',420],['Instant Noodles',180],['Rice',1200]].forEach(x=>addPreset(...x));
$('start').onclick=start;
$('pause').onclick=()=>{stop();msg.textContent=remaining?'Paused.':'Timer is at 00:00.'};
$('reset').onclick=()=>{stop();remaining=total;render();msg.textContent='Reset.'};
$('timerForm').onsubmit=e=>{e.preventDefault();setTimer((Number($('minutes').value)||0)*60+(Number($('seconds').value)||0))};
$('presetForm').onsubmit=e=>{
 e.preventDefault();
 const name=$('presetName').value.trim(), sec=(Number($('presetMinutes').value)||0)*60+(Number($('presetSeconds').value)||0);
 if(!name){msg.textContent='Please enter a button name.';return}
 if(sec<=0){msg.textContent='Please enter a time greater than 0.';return}
 addPreset(name,sec);$('presetName').value='';msg.textContent='Custom button added.'
};
render();
})();
</script>
</body>
</html>
